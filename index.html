<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit }
    from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyCKPnUeU_BCNFYH6j4dE7j149pGToYNWWM",
    authDomain:        "come-back-home-60413.firebaseapp.com",
    projectId:         "come-back-home-60413",
    storageBucket:     "come-back-home-60413.firebasestorage.app",
    messagingSenderId: "296963756140",
    appId:             "1:296963756140:web:dfe0870d3fe80f433b4849"
  };
  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  window.saveRankingDB = async (name, sc) => {
    try {
      const safeName = String(name).replace(/[<>&"']/g, c =>
        ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
      await addDoc(collection(db,"rankings"),{
        name:safeName, score:Number(sc),
        date:new Date().toLocaleDateString("ko-KR"),
        createdAt:Date.now()
      });
      return true;
    } catch(e){console.error("랭킹 저장 실패",e);return false;}
  };
  window.loadRankingDB = async () => {
    try {
      const q=query(collection(db,"rankings"),orderBy("score","desc"),limit(15));
      const snap=await getDocs(q);
      return snap.docs.map(d=>d.data());
    } catch(e){return [];}
  };
</script>

function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function collides(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function em(e,x,y,sz){
  ctx.save();ctx.font=(sz||32)+'px serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(e,x,y);ctx.restore();
}

// 컷씬
function startCutscene(key,onDone){
  var scenes=CUTSCENES[key];
  if(!scenes){if(onDone)onDone();return;}
  cutscene={scenes:scenes,idx:0,onDone:onDone};
  state='cutscene';hideMsg();
}
function nextCutscene(){
  if(!cutscene)return;
  cutscene.idx++;
  if(cutscene.idx>=cutscene.scenes.length){var cb=cutscene.onDone;cutscene=null;if(cb)cb();}
}
function addSpeech(text){speechBubbles=[{text:text,timer:200,maxTimer:200}];}
function resetTriggers(){
  var data=SPEECH_TRIGGERS_DATA[Math.min(stageIdx,SPEECH_TRIGGERS_DATA.length-1)]||[];
  currentTriggers=data.map(function(t){return{dist:t.dist,text:t.text,done:false};});
}

// 메시지 (버튼 여러개)
function showMsg(title,body,buttons){
  document.getElementById('msgTitle').textContent=title;
  document.getElementById('msgBody').textContent=body;
  var ni=document.getElementById('nameInput');
  var hasName=buttons.some(function(b){return b.needName;});
  ni.style.display=hasName?'block':'none';
  if(hasName){ni.value='';setTimeout(function(){ni.focus();},100);}
  var btns=document.getElementById('msgBtns');
  btns.innerHTML='';
  buttons.forEach(function(b){
    var el=document.createElement('button');
    el.textContent=b.label;
    if(b.sub)el.className='sub';
    el.onclick=function(){
      if(b.needName)b.action(ni.value.trim()||'무명 강아지');
      else b.action();
    };
    btns.appendChild(el);
  });
  document.getElementById('message').style.display='block';
}
function hideMsg(){document.getElementById('message').style.display='none';}

// 랭킹
async function openRanking(){
  rankingOpen=true;
  document.getElementById('rankPanel').style.display='block';
  document.getElementById('rankList').innerHTML='<li style="justify-content:center;color:#888">불러오는 중... 🐾</li>';
  var data=window.loadRankingDB?await window.loadRankingDB():[];
  renderRankList(data);
}
function closeRanking(){
  rankingOpen=false;
  document.getElementById('rankPanel').style.display='none';
  if(state!=='running'&&state!=='boss')state='title';
}
function renderRankList(data){
  var ul=document.getElementById('rankList');
  ul.innerHTML='';
  if(!data||data.length===0){
    var li=document.createElement('li');
    li.style.cssText='justify-content:center;color:#888';
    li.textContent='아직 기록이 없어요 🐾';ul.appendChild(li);return;
  }
  var medals=['🥇','🥈','🥉'],cls=['gold','silver','bronze'];
  data.forEach(function(r,i){
    var li=document.createElement('li');
    if(i<3)li.className=cls[i];
    var rank=document.createElement('span');rank.className='rrank';rank.textContent=medals[i]||(i+1);
    var name=document.createElement('span');name.className='rname';name.textContent=r.name;
    var sc=document.createElement('span');sc.className='rscore';sc.textContent='🦴'+r.score;
    var dt=document.createElement('span');dt.style.cssText='font-size:11px;color:#666;margin-left:6px';dt.textContent=r.date;
    li.append(rank,name,sc,dt);ul.appendChild(li);
  });
}

// 터치
var isMobile=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
if(isMobile)document.getElementById('touchControls').classList.add('show');
var touchKeys={left:false,right:false};
function setupTouchBtn(id,downFn,upFn){
  var el=document.getElementById(id);
  var down=function(e){e.preventDefault();if(downFn)downFn();};
  var up=function(e){e.preventDefault();if(upFn)upFn();};
  el.addEventListener('touchstart',down,{passive:false});
  el.addEventListener('touchend',up,{passive:false});
  el.addEventListener('mousedown',down);el.addEventListener('mouseup',up);
}
setupTouchBtn('btnLeft',function(){touchKeys.left=true;},function(){touchKeys.left=false;});
setupTouchBtn('btnRight',function(){touchKeys.right=true;},function(){touchKeys.right=false;});
setupTouchBtn('btnJump',function(){
  if(state==='title'&&!rankingOpen){hideMsg();startCutscene('stage0_intro',function(){state='running';initStage();});return;}
  if(state==='cutscene'){nextCutscene();return;}
  if(!dog.sliding&&dog.jumpsLeft>0){dog.vy=dog.jumpsLeft===2?-13.5:-11;dog.jumpsLeft--;}
},null);
setupTouchBtn('btnSlide',function(){
  if(!dog.sliding&&dog.jumpsLeft===2){dog.sliding=true;dog.slideTimer=28;}
},null);

var nameInput=document.getElementById('nameInput');
var keys={};
document.addEventListener('keydown',function(e){
  if(document.activeElement===nameInput)return;
  if(state==='cutscene'){nextCutscene();return;}
  if(rankingOpen)return;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)>=0)e.preventDefault();
  if(!keys[e.code]){
    if((e.code==='ArrowUp'||e.code==='Space')&&!dog.sliding&&dog.jumpsLeft>0){
      dog.vy=dog.jumpsLeft===2?-13.5:-11;dog.jumpsLeft--;
    }
    if(e.code==='ArrowDown'&&!dog.sliding&&dog.jumpsLeft===2){dog.sliding=true;dog.slideTimer=28;}
    if(state==='title'&&!rankingOpen){hideMsg();startCutscene('stage0_intro',function(){state='running';initStage();});}
  }
  keys[e.code]=true;
});
document.addEventListener('keyup',function(e){keys[e.code]=false;});
canvas.addEventListener('click',function(){if(state==='cutscene')nextCutscene();});

function resetDog(){dog.y=GROUND_Y;dog.vy=0;dog.jumpsLeft=2;dog.sliding=false;dog.slideTimer=0;}
function initBoss(){
  var b=BOSSES[Math.min(stageIdx,BOSSES.length-1)];
  var c=cfg();
  bossMaxTime=c.bossTime;bossTimeLeft=c.bossTime;
  bossAnim=0;projectiles=[];bossBonesCaught=0;nextThrow=randInt(30,70);
  boss={x:W-110,y:GROUND_Y+dog.h-60,tx:W-110,ty:GROUND_Y+dog.h-60,emoji:b.emoji,pattern:b.pattern,name:b.name};
  bossMoveTimer=0;resetBossMoveTarget();dog.x=80;resetDog();
  document.getElementById('boneGoal').style.display='block';
}
function resetBossMoveTarget(){
  boss.tx=rand(W*0.56,W-65);boss.ty=rand(GROUND_Y-150,GROUND_Y+dog.h-25);
  bossMoveTimer=randInt(90,200);
}
function spawnPlatform(){
  var themes=PLATFORM_THEMES[Math.min(stageIdx,PLATFORM_THEMES.length-1)];
  var t=themes[randInt(0,themes.length-1)];
  platforms.push({x:W+20,y:GROUND_Y-rand(70,175),w:t.w,h:16,emoji:t.emoji,color:t.color,hasBone:Math.random()<0.55});
}
function spawnBossThrow(){
  if(!boss)return;
  var c=cfg();
  var isBone=Math.random()<(0.60-stageIdx*0.05);
  var food=isBone?'🦴':FOODS[randInt(0,FOODS.length-1)];
  var sz=rand(20,34),bx=boss.x-30,by=boss.y-20,vScale=1+stageIdx*0.18,pat=boss.pattern;
  function push(vx,vy,grav,sy){
    projectiles.push({x:bx,y:sy!==undefined?sy:by,vx:vx,vy:vy,grav:grav,emoji:food,size:sz,isBone:isBone,life:PROJ_LIFE});
  }
  if(pat==='arc'){
    push(rand(-5,-3)*vScale,rand(-10,-6),rand(.32,.48));
    if(Math.random()<0.2+stageIdx*0.08)push(rand(-4.5,-2.5)*vScale,rand(-8,-5),rand(.28,.44));
  } else if(pat==='rapid'){
    var cnt=randInt(stageIdx>2?2:1,2+stageIdx);
    for(var i=0;i<cnt;i++)push(rand(-6,-3.5)*vScale,rand(-3,3),rand(0,.18),by-i*22);
  } else if(pat==='mixed'){
    push(rand(-5,-3)*vScale,rand(-9,-5),rand(.33,.46));
    if(Math.random()<0.5+stageIdx*0.1)push(rand(-5,-3.5)*vScale,0,0,GROUND_Y+dog.h-14);
    if(stageIdx>=2&&Math.random()<0.35)push(rand(-4,-2)*vScale,rand(-7,-4),rand(.3,.44));
  } else {
    var cnt2=randInt(1+Math.floor(stageIdx/2),2+stageIdx);
    for(var j=0;j<cnt2;j++){
      var spd=rand(4,8+stageIdx)*vScale,a=rand(145,215)*Math.PI/180;
      push(Math.cos(a)*spd,Math.sin(a)*spd-rand(0,5),rand(.2,.44));
    }
  }
  if(Math.random()<0.35+stageIdx*0.05)push(rand(-5,-2.5)*vScale,rand(-9,-5),rand(.3,.45));
  nextThrow=Math.random()<(0.2+stageIdx*0.05)?randInt(10,24):randInt(c.throwMin,c.throwMax);
}

function update(){
  if(state==='cutscene'||rankingOpen)return;
  if(state!=='running'&&state!=='boss')return;
  hitCooldown=Math.max(0,hitCooldown-1);
  hpFlash=Math.max(0,hpFlash-1);
  clouds.forEach(function(c){c.x-=.35;if(c.x<-90)c.x=W+90;});
  if(dog.slideTimer>0){dog.slideTimer--;if(dog.slideTimer===0)dog.sliding=false;}
  var maxX=state==='boss'?W/2-30:W/2-40;
  if(keys['ArrowLeft']||touchKeys.left)  dog.x=Math.max(20,dog.x-4);
  if(keys['ArrowRight']||touchKeys.right)dog.x=Math.min(maxX,dog.x+4);
  dog.vy+=0.62;dog.y+=dog.vy;
  if(dog.y>=GROUND_Y){dog.y=GROUND_Y;dog.vy=0;dog.jumpsLeft=2;}
  // 발판 착지
  if(state==='running'){
    for(var pi=0;pi<platforms.length;pi++){
      var p=platforms[pi];
      var dogL=dog.x+10,dogR=dog.x+dog.w-10;
      var dogBottom=dog.y+dog.h,prevBottom=dogBottom-dog.vy;
      if(dogR>p.x&&dogL<p.x+p.w&&dog.vy>=0&&prevBottom<=p.y+6&&dogBottom>=p.y){
        dog.y=p.y-dog.h;dog.vy=0;dog.jumpsLeft=2;
      }
    }
  }
  for(var si=0;si<speechBubbles.length;si++)speechBubbles[si].timer--;
  speechBubbles=speechBubbles.filter(function(b){return b.timer>0;});
  if(state==='running'){
    for(var ti=0;ti<currentTriggers.length;ti++){
      var t=currentTriggers[ti];
      if(!t.done&&stageDist>=t.dist){t.done=true;addSpeech(t.text);}
    }
  }
  if(state==='running')runUpdate();
  else bossUpdate();
  var th=lastHpBonusAt+HP_BONUS_EVERY;
  if(score>=th){hp=Math.min(hp+1,5);maxHp=Math.max(maxHp,hp);lastHpBonusAt=th;hpFlash=90;}
}

function runUpdate(){
  var c=cfg(),spd=c.obstacleSpeed;
  stageDist+=2.2;
  platTimer--;if(platTimer<=0){spawnPlatform();platTimer=randInt(180,340);}
  obTimer--;
  if(obTimer<=0){
    var sc=rand(.6,1.8+stageIdx*.12);
    obstacles.push({x:W+20,y:GROUND_Y+dog.h,w:44*sc,h:rand(28,55+stageIdx*3)*sc,emoji:OB_EMOJIS[randInt(0,OB_EMOJIS.length-1)],size:28*sc});
    if(Math.random()<c.doubleOb){var s2=rand(.5,1.4);obstacles.push({x:W+90+rand(0,40),y:GROUND_Y+dog.h,w:44*s2,h:rand(24,50)*s2,emoji:OB_EMOJIS[randInt(0,OB_EMOJIS.length-1)],size:28*s2});}
    if(Math.random()<c.tripleOb){var s3=rand(.4,1.2);obstacles.push({x:W+170+rand(0,40),y:GROUND_Y+dog.h,w:44*s3,h:rand(20,46)*s3,emoji:OB_EMOJIS[randInt(0,OB_EMOJIS.length-1)],size:28*s3});}
    obTimer=randInt(c.obstacleInterval[0],c.obstacleInterval[1]);
  }
  boneTimer--;
  if(boneTimer<=0){
    var cnt=randInt(2,5);
    for(var i=0;i<cnt;i++){bones.push({x:W+10+i*34,y:GROUND_Y-rand(14,85)});totalBones++;}
    boneTimer=randInt(c.boneInterval[0],c.boneInterval[1]);
  }
  heartSpawnTimer--;
  if(heartSpawnTimer<=0){
    heartItems.push({x:W+20,y:rand(GROUND_Y-160,GROUND_Y-40),timer:0,phase:Math.random()*Math.PI*2});
    heartSpawnTimer=randInt(HEART_SPAWN_MIN,HEART_SPAWN_MAX);
  }
  heartItems.forEach(function(h){h.x-=spd;h.timer++;h.y+=Math.sin(h.phase+h.timer*0.04)*0.6;});
  heartItems=heartItems.filter(function(h){return h.x>-40;});
  platforms.forEach(function(p){p.x-=spd;});
  obstacles.forEach(function(o){o.x-=spd;});
  bones.forEach(function(b){b.x-=spd;});
  platforms=platforms.filter(function(p){return p.x>-200;});
  obstacles=obstacles.filter(function(o){return o.x>-100;});
  platforms.forEach(function(p){
    if(p.hasBone){
      var bx=p.x+p.w/2,by=p.y-18,dcx=dog.x+dog.w/2,dcy=dog.y+dog.h/2;
      if(Math.abs(dcx-bx)<32&&Math.abs(dcy-by)<32){p.hasBone=false;score+=10;collectedBones++;}
    }
  });
  var dh=dog.sliding?dog.h-22:dog.h-6,dy2=dog.sliding?dog.y+18:dog.y+3;
  var dr={x:dog.x+10,y:dy2,w:dog.w-20,h:dh};
  heartItems=heartItems.filter(function(h){
    var hr={x:h.x-18,y:h.y-18,w:36,h:36};
    if(collides(dr,hr)){hp=Math.min(hp+1,5);maxHp=Math.max(maxHp,hp);hpFlash=90;return false;}
    return true;
  });
  if(hitCooldown===0){
    var hit=false;
    obstacles.forEach(function(o){
      if(hit)return;
      var or={x:o.x+6,y:o.y-o.h+6,w:o.w-12,h:o.h-8};
      if(collides(dr,or)){hit=true;hp--;hitCooldown=90;if(hp<=0)gameOver();}
    });
  }
  bones=bones.filter(function(b){
    var br={x:b.x-12,y:b.y-12,w:24,h:24};
    if(collides(dr,br)){score+=10;collectedBones++;return false;}
    return b.x>-30;
  });
  if(stageDist>=c.dist){
    var pct=totalBones>0?collectedBones/totalBones:1;
    if(pct>=BONE_GOAL_PCT){
      state='stageClear';
      showMsg('✨ 구간 통과!','뼈다귀 '+collectedBones+'/'+totalBones+'개 획득!\n다음은 '+BOSSES[Math.min(stageIdx,BOSSES.length-1)].name+'가 기다려요!',[
        {label:'보스 만나러 가기!',action:function(){
          var key='boss'+stageIdx+'_intro';
          if(CUTSCENES[key]){startCutscene(key,function(){state='boss';initBoss();});}
          else{state='boss';initBoss();}
        }}
      ]);
    } else {
      state='stageClear';
      showMsg('😅 뼈다귀가 부족해요!',collectedBones+'/'+totalBones+'개 획득 (필요: 30%)\n다시 달려볼까요?',[
        {label:'다시 시도',action:function(){hp=3;score=0;lastHpBonusAt=0;state='running';initStage();}}
      ]);
    }
  }
}

function bossUpdate(){
  bossTimeLeft-=1/60;bossAnim=(bossAnim+1)%60;
  bossMoveTimer--;if(bossMoveTimer<=0)resetBossMoveTarget();
  var dx=boss.tx-boss.x,dy=boss.ty-boss.y,dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>2){boss.x+=dx/dist*cfg().bossSpd;boss.y+=dy/dist*cfg().bossSpd;}
  nextThrow--;if(nextThrow<=0)spawnBossThrow();
  projectiles.forEach(function(p){
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.life--;
    if(p.y>=GROUND_Y+dog.h-10){p.y=GROUND_Y+dog.h-10;p.vy*=-.25;p.vx*=.65;
      if(Math.abs(p.vy)<.5)p.vy=0;if(Math.abs(p.vx)<.3)p.vx=0;}
  });
  projectiles=projectiles.filter(function(p){return p.life>0&&p.x>-50&&p.x<W+50;});
  var dh2=dog.sliding?dog.h-22:dog.h-6,dy3=dog.sliding?dog.y+18:dog.y+3;
  var dr={x:dog.x+10,y:dy3,w:dog.w-20,h:dh2};
  var bossHit=false;
  projectiles=projectiles.filter(function(p){
    var pr={x:p.x-13,y:p.y-13,w:26,h:26};
    if(collides(dr,pr)){
      if(p.isBone){bossBonesCaught++;score+=10;}
      else if(hitCooldown===0&&!bossHit){bossHit=true;hp--;hitCooldown=80;if(hp<=0)gameOver();}
      return false;
    }
    return true;
  });
  if(bossBonesCaught>=BOSS_BONE_GOAL){
    state='bossClear';
    var isLast=stageIdx>=BOSSES.length-1;
    if(isLast){
      scoreToRegister=score;
      showMsg('🎉 모든 스테이지 클리어!','집에 도착했어요! 🏠\n최종 점수: 🦴 '+scoreToRegister+'\n\n닉네임을 입력하고 랭킹에 등록하세요!',[
        {label:'🏆 랭킹 등록!',needName:true,action:async function(name){
          if(window.saveRankingDB)await window.saveRankingDB(name,scoreToRegister);
          stageIdx=0;score=0;hp=3;maxHp=3;lastHpBonusAt=0;scoreToRegister=0;state='title';
          await openRanking();
        }},
        {label:'처음부터 다시',sub:true,action:function(){stageIdx=0;score=0;hp=3;maxHp=3;lastHpBonusAt=0;state='running';initStage();}}
      ]);
    } else {
      showMsg('🎉 보스 격파!','뼈다귀 '+bossBonesCaught+'개 캐치!\n유혹을 이겨냈어요! 계속 달려요!',[
        {label:'다음 스테이지!',action:function(){stageIdx++;state='running';initStage();}}
      ]);
    }
  } else if(bossTimeLeft<=0){
    state='bossClear';
    showMsg('🦴 뼈다귀가 부족해요!',bossBonesCaught+'/'+BOSS_BONE_GOAL+'개 캐치\n🦴를 '+BOSS_BONE_GOAL+'개 이상 잡아야 해요!',[
      {label:'다시 도전!',action:function(){hp=3;score=0;lastHpBonusAt=0;state='boss';initBoss();}}
    ]);
  }
}

function gameOver(){
  state='gameover';
  scoreToRegister=score;
  showMsg('😢 게임 오버','뼈다귀 '+score+'개\n스테이지 '+(stageIdx+1)+'에서 쓰러졌어요...',[
    {label:'이어서 하기 (현재 스테이지)',action:function(){hp=3;state='running';initStage();}},
    {label:'🏆 랭킹 등록 후 처음부터',sub:true,needName:true,action:async function(name){
      if(window.saveRankingDB)await window.saveRankingDB(name,scoreToRegister);
      stageIdx=0;score=0;hp=3;maxHp=3;lastHpBonusAt=0;scoreToRegister=0;state='title';
      await openRanking();
    }},
    {label:'그냥 처음부터',sub:true,action:function(){stageIdx=0;score=0;hp=3;maxHp=3;lastHpBonusAt=0;state='running';initStage();}}
  ]);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(state==='cutscene'){drawCutscene();updateUI();return;}
  drawBg();
  if(state==='running'){drawPlatforms();drawObstacles();drawBones();drawHeartItems();drawProgress();}
  if(state==='boss'){drawBoss();drawProjectiles();drawBossTimer();}
  drawDog();drawSpeechBubbles();
  if(hpFlash>0)drawHpFlash();
  updateUI();
  if(state==='title')drawTitle();
}

function drawCutscene(){
  if(!cutscene)return;
  var s=cutscene.scenes[cutscene.idx];
  ctx.fillStyle=s.bg||'#1a1a2e';ctx.fillRect(0,0,W,H);
  ctx.font='100px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s.emoji||'🐕',W/2,H/2-40);
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,H-150,W,150);
  ctx.fillStyle='#fff';ctx.font='bold 19px Arial';ctx.textBaseline='top';
  var lines=(s.text||'').split('\n');
  for(var i=0;i<lines.length;i++)ctx.fillText(lines[i],W/2,H-138+i*30);
  ctx.fillStyle='#f7931e';ctx.font='14px Arial';ctx.fillText(s.sub||'',W/2,H-52);
  ctx.fillStyle='rgba(255,255,255,0.45)';ctx.font='12px Arial';
  ctx.fillText((cutscene.idx+1)+' / '+cutscene.scenes.length+'  ·  클릭 또는 아무 키나 눌러 계속',W/2,H-18);
}
function drawDog(){
  dogFrameTimer++;if(dogFrameTimer>9){dogFrame=(dogFrame+1)%2;dogFrameTimer=0;}
  ctx.save();ctx.translate(dog.x+dog.w/2,dog.y+dog.h);ctx.scale(-1.5,1.5);
  if(dog.sliding){
    ctx.font='38px serif';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.save();ctx.scale(1,0.55);ctx.fillText('🐕',0,-4/0.55);ctx.restore();
  } else {
    ctx.font=(dogFrame===0?'42':'40')+'px serif';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText('🐕',0,-4);
    if(dog.jumpsLeft===0&&dog.y<GROUND_Y-5){ctx.scale(-1,1);ctx.font='13px serif';ctx.fillText('✨',-16,-50);}
  }
  ctx.restore();
}
function drawBg(){
  var p=pal();
  ctx.fillStyle=p.sky;ctx.fillRect(0,0,W,H);
  clouds.forEach(function(c){
    ctx.fillStyle='rgba(255,255,255,0.82)';
    ctx.beginPath();ctx.ellipse(c.x,c.y,52*c.s,24*c.s,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(c.x+28*c.s,c.y+4*c.s,36*c.s,18*c.s,0,0,Math.PI*2);ctx.fill();
  });
  ctx.fillStyle=p.groundTop;ctx.fillRect(0,GROUND_Y+dog.h-5,W,9);
  ctx.fillStyle=p.ground;   ctx.fillRect(0,GROUND_Y+dog.h+4,W,H);
}
function drawPlatforms(){
  platforms.forEach(function(p){
    ctx.save();ctx.fillStyle=p.color;
    ctx.beginPath();ctx.roundRect(p.x,p.y,p.w,p.h,5);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=2;ctx.stroke();ctx.restore();
    em(p.emoji,p.x+20,p.y+p.h/2,20);
    if(p.hasBone)em('🦴',p.x+p.w/2,p.y-16,22);
  });
}
function drawObstacles(){obstacles.forEach(function(o){em(o.emoji,o.x+o.w/2,o.y-o.h/2,o.size);});}
function drawBones(){bones.forEach(function(b){em('🦴',b.x,b.y,24);});}
function drawHeartItems(){
  heartItems.forEach(function(h){
    var scale=1+Math.sin(h.timer*0.06)*0.12;
    ctx.save();ctx.translate(h.x,h.y);ctx.scale(scale,scale);
    ctx.globalAlpha=0.25+Math.sin(h.timer*0.1)*0.15;
    ctx.fillStyle='#ff4466';ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;ctx.font='28px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('❤️',0,0);ctx.restore();
  });
}
function drawSpeechBubbles(){
  speechBubbles.forEach(function(b){
    var alpha=Math.min(1,b.timer/30,(b.maxTimer-b.timer)/20);
    var lines=b.text.split('\n'),bw=170,bh=14+lines.length*24;
    var bx=Math.min(Math.max(dog.x+dog.w/2-bw/2,4),W-bw-4),by=dog.y-bh-28;
    ctx.save();ctx.globalAlpha=alpha;
    ctx.fillStyle='rgba(255,255,255,0.95)';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,10);ctx.fill();
    ctx.strokeStyle='#f7931e';ctx.lineWidth=2.5;ctx.stroke();
    var cx2=dog.x+dog.w/2;
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.beginPath();ctx.moveTo(cx2-8,by+bh);ctx.lineTo(cx2+8,by+bh);ctx.lineTo(cx2,by+bh+12);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#f7931e';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#222';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.textBaseline='top';
    for(var i=0;i<lines.length;i++)ctx.fillText(lines[i],bx+bw/2,by+8+i*24);
    ctx.restore();
  });
}
function drawBoss(){
  if(!boss)return;
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(boss.x,GROUND_Y+dog.h+2,28,8,0,0,Math.PI*2);ctx.fill();ctx.restore();
  em(boss.emoji,boss.x,boss.y,62);
  var bw=86,bh=8,bx=boss.x-bw/2,by=boss.y-70;
  ctx.fillStyle='#222';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=Math.max(0,bossTimeLeft/bossMaxTime)>.5?'#2ecc71':'#e74c3c';
  ctx.fillRect(bx,by,bw*Math.max(0,bossTimeLeft/bossMaxTime),bh);
  ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
  ctx.font='10px Arial';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(boss.name,boss.x,by-5);
}
function drawProjectiles(){
  projectiles.forEach(function(p){
    if(p.life<=BLINK_START&&Math.floor(p.life/5)%2===0)return;
    em(p.emoji,p.x,p.y,p.size||28);
  });
}
function drawBossTimer(){
  var tw=220,th=10,tx=W/2-tw/2,ty=14;
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(tx,ty,tw,th);
  var r=Math.max(0,bossTimeLeft/bossMaxTime);
  ctx.fillStyle=r>.4?'#3498db':'#e74c3c';ctx.fillRect(tx,ty,tw*r,th);
  ctx.font='11px Arial';ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.fillText('버텨라! '+Math.ceil(bossTimeLeft)+'초',W/2,ty-3);
}
function drawProgress(){
  var c=cfg(),pw=W-60,ph=7,px=30,py=H-13;
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(px,py,pw,ph);
  ctx.fillStyle='#f7931e';ctx.fillRect(px,py,pw*(stageDist/c.dist),ph);
  em('🐕',px+pw*(stageDist/c.dist),py+ph/2,18);
  em('🏠',px+pw+14,py+ph/2,20);
}
function drawHpFlash(){
  ctx.save();ctx.fillStyle='rgba(255,80,80,'+(hpFlash/90*0.28)+')';ctx.fillRect(0,0,W,H);
  ctx.font='bold 20px Arial';ctx.fillStyle='rgba(255,255,255,'+(hpFlash/90)+')';ctx.textAlign='center';
  ctx.fillText('❤️ +1 보너스!',W/2,H/2-16);ctx.restore();
}
function drawTitle(){
  ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
  ctx.font='bold 36px Arial';ctx.fillStyle='#fff';ctx.fillText('🐕 강아지 집 찾기',W/2,H/2-58);
  ctx.font='14px Arial';ctx.fillStyle='#ddd';ctx.fillText('길을 잃은 강아지가 집으로 돌아가는 여정!',W/2,H/2-22);
  ctx.font='12px Arial';ctx.fillStyle='#aaa';
  ctx.fillText('🦴 30% 획득 → 보스 도전  |  ❤️ 하트 획득 시 HP+1  |  🏆 공유 랭킹',W/2,H/2+8);
  ctx.font='15px Arial';ctx.fillStyle='#f7931e';ctx.fillText('아무 키나 눌러 시작',W/2,H/2+50);
}
function updateUI(){
  document.getElementById('stageLabel').textContent=state==='boss'?(boss?boss.name:''):'스테이지 '+(stageIdx+1)+' · '+pal().name;
  document.getElementById('scoreLabel').textContent='🦴 '+score;
  document.getElementById('hpLabel').textContent='❤️'.repeat(Math.max(0,hp))+'🖤'.repeat(Math.max(0,3-hp));
  var bg=document.getElementById('boneGoal');
  if(state==='boss'){
    bg.style.display='block';bg.textContent='🦴 '+bossBonesCaught+'/'+BOSS_BONE_GOAL;
    bg.style.color=bossBonesCaught>=BOSS_BONE_GOAL?'#2ecc71':'#fff';
  } else if(state==='running'){
    bg.style.display='block';
    var pct=totalBones>0?Math.floor(collectedBones/totalBones*100):0;
    bg.textContent=collectedBones+'/'+totalBones+'개 ('+pct+'%)';
    bg.style.color=pct>=30?'#2ecc71':'#fff';
  } else{bg.style.display='none';}
}

function loop(){update();draw();requestAnimationFrame(loop);}
state='title';
loop();
</script>

</html>
